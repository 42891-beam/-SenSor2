<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Image Model</title>
    <!-- นำเข้าฟอนต์ Google Fonts เพื่อความสวยงาม -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333333;
            padding: 20px;
        }

        .main-card {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h2 {
            color: #2c3e50;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .info-text {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .btn-primary {
            background-color: #3498db;
            color: #ffffff;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(52, 152, 219, 0.3);
        }

        .btn-primary:hover {
            background-color: #2980b9;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(52, 152, 219, 0.4);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        #webcam-container {
            margin: 25px 0;
            display: flex;
            justify-content: center;
        }

        #webcam-container canvas {
            border-radius: 12px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            border: 4px solid #ffffff;
            background-color: #f8f9fa;
        }

        #label-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .result-row {
            background-color: #f8f9fa;
            padding: 12px 20px;
            border-radius: 10px;
            border-left: 5px solid #2ecc71;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .class-name {
            color: #34495e;
        }

        .class-probability {
            color: #27ae60;
            background-color: #e8f8f5;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="main-card">
    <h2>Teachable Machine Image Model</h2>[cite: 3]
    <p class="info-text">ภาพแสดงผลสดลื่นไหลปกติ ระบบจะทำการวิเคราะห์วัตถุในทุก ๆ 3 วินาที</p>
    
    <button type="button" class="btn-primary" onclick="init()">เริ่มเปิดกล้อง (Start)</button>[cite: 3]
    
    <div id="webcam-container"></div>[cite: 3]
    <div id="label-container"></div>[cite: 3]
</div>

<!-- โหลด TensorFlow และ Teachable Machine Library -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>[cite: 3]
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>[cite: 3]

<script type="text/javascript">
    // ลิงก์โมเดลของคุณ
    const URL = "https://teachablemachine.withgoogle.com/models/jkT2DnYZd/";[cite: 3]

    let model, webcam, labelContainer, maxPredictions;
    let analysisInterval;

    // ฟังก์ชันเริ่มต้นโหลดโมเดลและเปิดกล้อง
    async function init() {
        // ซ่อนปุ่มเริ่มทำงานทันทีหลังจากกด
        document.querySelector('.btn-primary').style.display = 'none';

        const modelURL = URL + "model.json";[cite: 3]
        const metadataURL = URL + "metadata.json";[cite: 3]

        // โหลดโมเดล AI[cite: 3]
        model = await tmImage.load(modelURL, metadataURL);[cite: 3]
        maxPredictions = model.getTotalClasses();[cite: 3]

        // ตั้งค่ากล้องเว็บแคม (ปรับขนาดเป็น 250x250 พิกเซลให้ดูชัดเจนสวยงาม)
        const flip = true; 
        webcam = new tmImage.Webcam(250, 250, flip);[cite: 3]
        await webcam.setup(); // ขอสิทธิ์เข้าถึงกล้อง[cite: 3]
        await webcam.play();[cite: 3]
        
        // รันแอนิเมชันให้กล้องแสดงผลสดแบบเรียลไทม์ (ภาพไม่กระตุก)
        window.requestAnimationFrame(loop);[cite: 3]

        // นำกล้องแสดงผลลงในแท็ก HTML[cite: 3]
        document.getElementById("webcam-container").appendChild(webcam.canvas);[cite: 3]
        labelContainer = document.getElementById("label-container");[cite: 3]
        
        // สร้างกล่องแสดงผลลัพธ์ตามจำนวนคลาสที่มี
        for (let i = 0; i < maxPredictions; i++) {[cite: 3]
            let div = document.createElement("div");
            div.className = "result-row";
            labelContainer.appendChild(div);[cite: 3]
        }

        // สั่งทำนายผลครั้งแรกในทันที
        await predict();

        // [ตั้งเวลา 3 วินาที] เรียกฟังก์ชันทำนายผล (predict) ทุกๆ 3000 มิลลิวินาที
        analysisInterval = setInterval(predict, 3000);
    }

    // ฟังก์ชันลูปสำหรับอัปเดตภาพหน้าจอกล้องให้ขยับอยู่ตลอดเวลา
    async function loop() {
        webcam.update();[cite: 3]
        window.requestAnimationFrame(loop);[cite: 3]
    }

    // ฟังก์ชันส่งภาพไปประมวลผลผ่านโมเดลเพื่อแปลงเป็นผลลัพธ์
    async function predict() {
        if (!model || !webcam) return;

        // ประมวลผลภาพจากกล้องปัจจุบัน[cite: 3]
        const prediction = await model.predict(webcam.canvas);[cite: 3]
        for (let i = 0; i < maxPredictions; i++) {[cite: 3]
            const className = prediction[i].className;
            // แปลงค่าทศนิยมของผลลัพธ์ให้เป็น % เพื่อให้อ่านง่าย เช่น 0.99 -> 99%
            const probabilityPercent = (prediction[i].probability * 100).toFixed(0) + "%";
            
            // นำผลลัพธ์ที่ได้ไปจัดแสดงใน UI แถวที่เตรียมไว้
            labelContainer.childNodes[i].innerHTML = `
                <span class="class-name">${className}</span>
                <span class="class-probability">${probabilityPercent}</span>
            `;
        }
    }
</script>

</body>
</html>
