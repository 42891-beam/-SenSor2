<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Image Model</title>
    <!-- นำเข้าฟอนต์ Google Fonts เพื่อความสวยงาม -->
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            font-family: 'Sarabun', sans-serif;
            background: linear-gradient(135deg, #e0eafc 0%, #cfdef3 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #333333;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 450px;
            width: 100%;
        }

        h2 {
            color: #2c3e50;
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 25px;
        }

        .btn-start {
            background-color: #4a69bd;
            color: #ffffff;
            border: none;
            padding: 14px 35px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(74, 105, 189, 0.3);
        }

        .btn-start:hover {
            background-color: #1e3799;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(74, 105, 189, 0.4);
        }

        #webcam-container {
            margin: 25px 0;
            display: flex;
            justify-content: center;
        }

        #webcam-container canvas {
            border-radius: 14px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
            border: 4px solid #ffffff;
            background-color: #f8f9fa;
        }

        #label-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            text-align: left;
        }

        .label-box {
            background-color: #f8f9fa;
            padding: 12px 20px;
            border-radius: 10px;
            border-left: 5px solid #38ada9;
            font-weight: 600;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .class-text {
            color: #2c3e50;
        }

        .probability-text {
            color: #38ada9;
            background-color: #e8f8f5;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Teachable Machine Image Model</h2>
    <p class="subtitle">แสดงภาพสดปกติ และระบบจะวิเคราะห์รูปภาพเพื่อทำนายผลทุก ๆ 3 วินาที</p>
    
    <button type="button" class="btn-start" onclick="init()">เริ่มทำงาน (Start)</button>
    
    <div id="webcam-container"></div>
    <div id="label-container"></div>
</div>

<!-- โหลด TensorFlow และ Teachable Machine Library จาก CDN -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

<script type="text/javascript">
    // ลิงก์โมเดลจากระบบ Teachable Machine ของคุณ
    const URL = "https://teachablemachine.withgoogle.com/models/jkT2DnYZd/";

    let model, webcam, labelContainer, maxPredictions;
    let lastPredictTime = 0; // ตัวแปรเก็บเวลาล่าสุดที่บันทึกการทำนายผล

    // ฟังก์ชันเปิดใช้งานโมเดลและเซ็ตระบบกล้อง
    async function init() {
        // ซ่อนปุ่มกดเพื่อป้องกันการกดซ้ำซ้อน
        document.querySelector('.btn-start').style.display = 'none';

        const modelURL = URL + "model.json";
        const metadataURL = URL + "metadata.json";

        // โหลดตัวโมเดล AI ออกมาใช้งาน
        model = await tmImage.load(modelURL, metadataURL);
        maxPredictions = model.getTotalClasses();

        // ตั้งค่าตัวกล้องแคม (ขนาด 250x250 พิกเซล พร้อมเปิดการกลับซ้ายขวาแบบกระจกเงา)
        const flip = true; 
        webcam = new tmImage.Webcam(250, 250, flip);
        await webcam.setup(); // ร้องขอการเปิดใช้สิทธิ์ตัวกล้องจากเบราว์เซอร์
        await webcam.play();
        
        // เริ่มต้นลูปเพื่อให้ภาพกล้องเคลื่อนไหวอย่างราบรื่น
        window.requestAnimationFrame(loop);

        // ใส่หน้าจอกล้องลงไปใน HTML
        document.getElementById("webcam-container").appendChild(webcam.canvas);
        labelContainer = document.getElementById("label-container");
        
        // สร้างกรอบข้อความเพื่อรอแสดงผลเปอร์เซ็นต์คำทำนาย
        for (let i = 0; i < maxPredictions; i++) {
            let div = document.createElement("div");
            div.className = "label-box";
            labelContainer.appendChild(div);
        }

        // กำหนดเวลาเริ่มต้นสำหรับการทำนายผล
        lastPredictTime = Date.now();
        await predict();
    }

    // ฟังก์ชันควบคุมการทำงานของกล้องสดและจัดการเรื่องเวลา
    async function loop() {
        webcam.update(); // ดึงเฟรมปัจจุบันจากกล้องมาแสดงผลให้ภาพเคลื่อนไหวลื่นไหลเป็นปกติ
        
        let currentTime = Date.now();
        // ตรวจสอบว่าเวลาผ่านไปแล้วครบ 3 วินาที (3000 มิลลิวินาที) หรือยัง
        if (currentTime - lastPredictTime >= 3000) {
            await predict(); // สั่งให้ AI ประมวลผลภาพ
            lastPredictTime = currentTime; // บันทึกเวลาที่ทำนายผลล่าสุดไว้
        }
        
        window.requestAnimationFrame(loop);
    }

    // ฟังก์ชันส่งรูปภาพจากกล้องไปประมวลผลคำทำนายและแสดงผลลัพธ์ลง UI
    async function predict() {
        if (!model || !webcam) return;

        // ดึงภาพจากเฟรมกล้องไปตรวจจับผลลัพธ์ผ่านโมเดล
        const prediction = await model.predict(webcam.canvas);
        for (let i = 0; i < maxPredictions; i++) {
            const className = prediction[i].className;
            // แปลงค่าจุดทศนิยมความน่าจะเป็นให้เป็นเปอร์เซ็นต์ (เช่น 0.95 -> 95%)
            const percent = (prediction[i].probability * 100).toFixed(0) + "%";
            
            // อัปเดตข้อมูลลงไปในกล่องแสดงผลลัพธ์บนหน้าจอ
            labelContainer.childNodes[i].innerHTML = `
                <span class="class-text">${className}</span>
                <span class="probability-text">${percent}</span>
            `;
        }
    }
</script>

</body>
</html>
